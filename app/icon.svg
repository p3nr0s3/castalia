<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#iconGradient)" />
  
  <!-- Robot Antenna -->
  <path d="M32 20 V12 H24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="24" cy="12" r="2.5" fill="#38bdf8" />
  
  <!-- Robot Head Box -->
  <rect x="14" y="20" width="36" height="28" rx="7" stroke="#ffffff" stroke-width="3" fill="rgba(15, 23, 42, 0.4)" />
  
  <!-- Ears / Side Pins -->
  <path d="M10 34 h4 M50 34 h4" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  
  <!-- Glowing Eyes -->
  <circle cx="25" cy="32" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="39" cy="32" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="26" cy="31" r="1" fill="#ffffff" />
  <circle cx="40" cy="31" r="1" fill="#ffffff" />
  
  <!-- Mouth / Sparkles -->
  <path d="M26 40 Q32 44 38 40" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
