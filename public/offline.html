<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyra — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #090d16; color: #e5e7eb; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 420px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; opacity: .75; margin: 0 0 16px; }
      button { font: inherit; padding: 8px 18px; border-radius: 10px; border: 1px solid #475569; background: transparent; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Server Lyra tidak terjangkau</h1>
      <p>Lyra berjalan di komputer Anda. Pastikan servernya menyala (<code>npm start</code>) dan perangkat ini terhubung ke jaringan yang sama, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
