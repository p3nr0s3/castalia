name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.x: the minimum supported version (SQLite backend falls back to JSON there).
        # 22.x: recommended; exercises the better-sqlite3 backend and the TypeScript runner.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # .npmrc sets ignore-scripts=true; better-sqlite3 uses its bundled prebuilt binary.
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit (vs reviewed baseline)
    runs-on: ubuntu-latest
    # next@14 has known advisories with no patch in the 14.x line (see the security note in
    # next.config.mjs), so plain `npm audit` would be permanently red. Instead this fails ONLY
    # for advisories/packages that are not in .github/audit-baseline.json, i.e. ones nobody
    # has reviewed yet. See scripts/auditCheck.mjs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm ci` needed: audit reads package-lock.json. Write to a file rather than piping:
      # GitHub's default shell uses `pipefail`, and `npm audit` exits 1 whenever it finds anything.
      - name: Fetch audit report
        run: npm audit --omit=dev --json > audit.json || true
      - name: Compare with reviewed baseline
        run: node scripts/auditCheck.mjs < audit.json
